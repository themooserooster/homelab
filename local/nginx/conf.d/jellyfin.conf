# Jellyfin
server {
  listen 443 ssl;
  server_name jellyfin.mooserooster.com;

   ssl_certificate /etc/letsencrypt/live/mooserooster.com/cert.pem;
   ssl_certificate_key /etc/letsencrypt/live/mooserooster.com/privkey.pem;

  location / {
    proxy_pass http://localhost:8096;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

