services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ./.jellyfin/config:/config
      - ./.jellyfin/cache:/cache
      - /mnt/jellyfin/media/music:/mnt/music
      - /mnt/jellyfin/media/movies:/mnt/movies
      - /mnt/jellyfin/media/tv:/mnt/tv
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN:?set DOMAIN in local/.env}
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
    volumes:
      - ./wireguard:/etc/wireguard/
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in local/.env}
      # Preserve Nginx runtime variables such as $host during template rendering.
      NGINX_ENVSUBST_FILTER: '^(DOMAIN)$'
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: certbot
    profiles:
      - manual
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/log/letsencrypt:/var/log/letsencrypt
      - /etc/letsencrypt/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    entrypoint:
      - certbot
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "${LAN_IP:?set LAN_IP in local/.env}:53:53/tcp"
      - "${LAN_IP:?set LAN_IP in local/.env}:53:53/udp"
      - "127.0.0.1:8083:80/tcp"
    environment:
      TZ: ${TZ:-America/Chicago}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in local/.env}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 9.9.9.9
      # Compose owns app host records; this Pi-hole setting is read-only in its UI.
      FTLCONF_dns_hosts: |-
        ${LAN_IP:?set LAN_IP in local/.env} dns.${DOMAIN:?set DOMAIN in local/.env}
        ${LAN_IP:?set LAN_IP in local/.env} jellyfin.${DOMAIN:?set DOMAIN in local/.env}
    volumes:
      - ./.pihole/etc-pihole:/etc/pihole
    
      