services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /mnt/jellyfin/config:/config
      - /mnt/jellyfin/cache:/cache
      - /mnt/jellyfin/media/music:/music
      - /mnt/jellyfin/media/movies:/movies
      - /mnt/jellyfin/media/tv:/tv
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.mooserooster.com
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
    volumes:
      - ./wg0.conf:/etc/wireguard/wg0.conf
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl/certs:/etc/ssl/certs